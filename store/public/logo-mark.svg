<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332A20" />
      <stop offset="1" stop-color="#17130E" />
    </linearGradient>
    <radialGradient id="led" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF6A52" />
      <stop offset="1" stop-color="#C1652F" />
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#panel)" />
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2" />

  <!-- rack rails -->
  <line x1="60" y1="86" x2="60" y2="426" stroke="#000" stroke-opacity="0.45" stroke-width="5" />
  <line x1="452" y1="86" x2="452" y2="426" stroke="#000" stroke-opacity="0.45" stroke-width="5" />

  <!-- corner bolts -->
  <g fill="none" stroke="#5c503d" stroke-opacity="0.7" stroke-width="3">
    <circle cx="70" cy="76" r="19" />
    <circle cx="442" cy="76" r="19" />
    <circle cx="70" cy="436" r="19" />
    <circle cx="442" cy="436" r="19" />
  </g>
  <g fill="#000" fill-opacity="0.55">
    <circle cx="70" cy="76" r="6" />
    <circle cx="442" cy="76" r="6" />
    <circle cx="70" cy="436" r="6" />
    <circle cx="442" cy="436" r="6" />
  </g>

  <!-- status LED -->
  <circle cx="150" cy="150" r="17" fill="url(#led)" />

  <!-- signal bars -->
  <g>
    <rect x="330" y="156" width="16" height="24" fill="#F0B429" />
    <rect x="354" y="140" width="16" height="40" fill="#F0B429" />
    <rect x="378" y="122" width="16" height="58" fill="#F0B429" />
    <rect x="402" y="104" width="16" height="76" fill="#5A5248" />
  </g>

  <!-- AL monogram -->
  <polyline points="118,430 185,250 270,430" fill="none" stroke="#F3EEDF"
    stroke-width="42" stroke-linecap="square" stroke-linejoin="miter" />
  <polyline points="325,250 325,430 395,430" fill="none" stroke="#F3EEDF"
    stroke-width="42" stroke-linecap="square" stroke-linejoin="miter" />
</svg>
